<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Sổ theo dõi thiết kế</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#EDF0F2" id="metaTheme">
<script>(function(){var t='auto';try{t=localStorage.getItem('stk-theme')||'auto'}catch(e){}window.__theme=t;if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)})();</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: một sổ theo dõi, bốn tab (bản vẽ, thay đổi, RFI, văn bản). Mỗi tab là một danh sách dòng bấm để mở chi tiết, giống bảng kê trong hồ sơ bản vẽ. */
:root{
  --bg:#EDF0F2; --surface:#FFFFFF; --surface2:#F5F7F8; --ink:#14212B; --ink2:#51616C; --line:#CDD5DA;
  --accent:#1B5E86; --accent-ink:#FFFFFF; --accent-soft:#DCEAF2;
  --ok:#1E7A4C; --ok-bg:#DDF0E5; --warn:#7A4E00; --warn-bg:#FBEBC8; --crit:#B3261E; --crit-bg:#F9DEDB; --info:#1B5E86; --info-bg:#DCEAF2; --mute:#5E6B74; --mute-bg:#E6EAED;
  --f-display:'Bricolage Grotesque','Be Vietnam Pro',system-ui,sans-serif;
  --f-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F171D; --surface:#17222A; --surface2:#1C2932; --ink:#E6EDF1; --ink2:#9AABB6; --line:#2C3C47;
  --accent:#6BB2DB; --accent-ink:#0B1A23; --accent-soft:#1F3644;
  --ok:#6CD39B; --ok-bg:#16382A; --warn:#F0C265; --warn-bg:#3B2E10; --crit:#FF9B93; --crit-bg:#432220; --info:#6BB2DB; --info-bg:#1F3644; --mute:#9AABB6; --mute-bg:#24323B;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F171D; --surface:#17222A; --surface2:#1C2932; --ink:#E6EDF1; --ink2:#9AABB6; --line:#2C3C47;
  --accent:#6BB2DB; --accent-ink:#0B1A23; --accent-soft:#1F3644;
  --ok:#6CD39B; --ok-bg:#16382A; --warn:#F0C265; --warn-bg:#3B2E10; --crit:#FF9B93; --crit-bg:#432220; --info:#6BB2DB; --info-bg:#1F3644; --mute:#9AABB6; --mute-bg:#24323B;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-block:1.25rem 3rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:68rem;margin:0 auto;display:flex;flex-direction:column;gap:1rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:.75rem 1.5rem;flex-wrap:wrap;border-top:4px solid var(--ink);padding-top:.75rem}
.eyebrow{font:500 .75rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.6rem,4.5vw,2.3rem);line-height:1.1;margin:.2rem 0 0;text-wrap:balance}
.sync{font:.75rem var(--f-mono);color:var(--ink2);display:flex;align-items:center;gap:.45rem}
.dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--mute);flex:none}
.dot.on{background:var(--ok)} .dot.err{background:var(--crit)}

.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);background:var(--surface);border-radius:6px;overflow:hidden}
.tab{background:none;border:0;border-right:1px solid var(--line);padding:.7rem 1rem .6rem;text-align:left;cursor:pointer;color:var(--ink2);min-width:0}
.tab:last-child{border-right:0}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}
.tab .lbl{display:block;font-size:.8125rem;font-weight:500}
.tab .num{display:block;font:600 1.6rem/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.tab .attn{display:block;font-size:.75rem;font-weight:500;min-height:1.2em}
.tone-warn{color:var(--warn)} .tone-crit{color:var(--crit)}
@media (max-width:640px){
  .tabs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tab:nth-child(2n){border-right:0}
  .tab:nth-child(5){grid-column:1/-1;border-right:0}
  .tab:nth-child(-n+4){border-bottom:1px solid var(--line)}
}

.bar{display:flex;flex-wrap:wrap;gap:.5rem}
.bar .grow{flex:1 1 14rem;min-width:0}
.bar select{flex:0 1 13rem}
.bar .btns{display:flex;flex-wrap:wrap;gap:.5rem}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:.5rem .65rem;min-width:0;width:100%}
input.mono{font-family:var(--f-mono);font-size:.9rem}
textarea{resize:vertical;line-height:1.45}
.bar select{width:auto}
.btn{font:500 .875rem var(--f-body);border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.5rem .85rem;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn:disabled{opacity:.55;cursor:default}
.note{color:var(--ink2);font-size:.8125rem;margin:0}

.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.item+.item{border-top:1px solid var(--line)}
.head{display:grid;grid-template-columns:9rem minmax(0,1fr) auto;gap:.3rem 1rem;align-items:start;width:100%;text-align:left;background:none;border:0;padding:.85rem 1rem;cursor:pointer}
.head:hover{background:var(--surface2)}
.code{font:500 .8125rem var(--f-mono);overflow-wrap:anywhere}
.rev{display:inline-block;margin-left:.4rem;font:500 .6875rem var(--f-mono);padding:.05rem .4rem;border:1px solid var(--line);border-radius:3px;color:var(--ink2);vertical-align:1px}
.main{min-width:0}
.ttl{display:block;font-weight:500;overflow-wrap:anywhere}
.sub{display:block;color:var(--ink2);font-size:.8125rem;overflow-wrap:anywhere}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.grp+.grp{margin-top:.75rem}
.gh1{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;background:var(--ink);color:var(--bg);border:0;padding:.8rem 1rem;cursor:pointer}
.gh1 .gname{font:700 1.15rem var(--f-display);flex:1;min-width:0;overflow-wrap:anywhere}
.gh1 .gcount{font:.75rem var(--f-mono);opacity:.8;white-space:nowrap}
.gbody{padding:.25rem 0 .5rem}
.sec{padding:0 .75rem}
.sec+.sec{border-top:1px solid var(--line)}
.sec-h{display:flex;align-items:center;gap:.5rem;padding:.2rem 0}
.gh2{display:flex;align-items:center;gap:.6rem;flex:1;min-width:0;text-align:left;background:none;border:0;padding:.6rem .25rem;cursor:pointer;color:var(--ink)}
.gh2 .gname{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.gh2 .gcount{font:500 .75rem var(--f-mono);color:var(--ink2);background:var(--mute-bg);border-radius:999px;padding:.05rem .55rem}
.chev{width:.5rem;height:.5rem;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);flex:none;transition:transform .12s}
[aria-expanded="true"]>.chev{transform:rotate(45deg)}
.btn.sm{padding:.3rem .65rem;font-size:.8125rem}
.sec .list{margin:.1rem 0 .75rem}
.sec-empty{padding:.2rem .25rem .8rem}
@media (max-width:640px){.gh1 .gcount{display:none}}
.meta{display:flex;flex-wrap:wrap;gap:.1rem .9rem;color:var(--ink2);font-size:.8125rem;margin-top:.15rem}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:.3rem}
.pill{display:inline-block;font-size:.75rem;font-weight:500;padding:.1rem .6rem;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.info{background:var(--info-bg);color:var(--info)} .pill.mute{background:var(--mute-bg);color:var(--mute)}
@media (max-width:640px){
  .head{grid-template-columns:minmax(0,1fr) auto}
  .head .code{grid-column:1;grid-row:1}
  .head .side{grid-column:2;grid-row:1}
  .head .main{grid-column:1/-1;grid-row:2}
}

.detail{padding:.25rem 1rem 1rem;border-top:1px dashed var(--line);background:var(--surface2)}
.kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:.7rem 1.5rem;margin:.8rem 0}
.kv{min-width:0} .kv.wide{grid-column:1/-1}
.kv dt{font:500 .6875rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.kv dd{margin:.1rem 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.histwrap{overflow-x:auto;margin:.5rem 0}
.hist{border-collapse:collapse;width:100%;min-width:24rem;font-size:.8125rem}
.hist th{font:500 .6875rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);text-align:left;padding:.3rem .6rem .3rem 0;border-bottom:1px solid var(--line)}
.hist td{padding:.35rem .6rem .35rem 0;border-bottom:1px solid var(--line);vertical-align:top}
.hist td:first-child{font-family:var(--f-mono)}
.hist tr.cur td{font-weight:600}
.sech{font:500 .6875rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:1rem 0 0}
.by{font-size:.75rem;color:var(--ink2);margin:.6rem 0 0}
.acts{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.8rem}

.empty{background:var(--surface);border:1px dashed var(--ink2);border-radius:6px;padding:2rem 1.25rem;display:flex;flex-direction:column;gap:.6rem;align-items:flex-start}
.empty h2{font-family:var(--f-display);font-size:1.15rem;margin:0}
.empty p{margin:0;color:var(--ink2);max-width:46ch}
.banner{background:var(--crit-bg);color:var(--crit);border-radius:6px;padding:.7rem 1rem;font-size:.875rem}

.scrim{position:fixed;inset:0;background:rgba(8,14,18,.55);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:max(1rem,env(safe-area-inset-top,0px)) max(1rem,env(safe-area-inset-right,0px)) max(1rem,env(safe-area-inset-bottom,0px)) max(1rem,env(safe-area-inset-left,0px));z-index:50}
.panel{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;width:100%;max-width:40rem;margin:auto 0;padding:1.1rem 1.25rem 1.25rem}
.panel h2{font-family:var(--f-display);font-size:1.25rem;margin:0 0 .8rem;text-wrap:balance}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem 1rem}
.fld{min-width:0} .fld.wide{grid-column:1/-1}
.fld label{display:block;font-size:.8125rem;font-weight:500;margin-bottom:.25rem}
.req{color:var(--crit)}
.hint{font-size:.75rem;color:var(--ink2);margin:.25rem 0 0}
.foot{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:flex-end;align-items:center;margin-top:1.1rem}
.foot .msg{flex:1 1 12rem;font-size:.8125rem;color:var(--crit);min-height:1.2em}
.foot .msg.ok{color:var(--ok)}
@media (max-width:560px){.grid{grid-template-columns:minmax(0,1fr)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(1rem + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:.55rem 1rem;border-radius:4px;font-size:.875rem;z-index:60;max-width:calc(100% - 2rem)}
@media (prefers-reduced-motion:no-preference){.detail{animation:in .15s ease-out}@keyframes in{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}}

/* Vấn đề chạy theo vòng: mỗi vấn đề gồm các giai đoạn nối tiếp, mỗi giai đoạn là chuỗi các lần gửi giữa các bên. Mới nhất ở trên, cũ nhất ở dưới. */
.ballbar{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.ballbar .lbl{font:500 .75rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-right:.2rem}
.bb{display:inline-flex;gap:.45rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.3rem .75rem;cursor:pointer;font-size:.8125rem;font-weight:500}
.bb b{font:600 .8125rem var(--f-mono);background:var(--mute-bg);border-radius:999px;padding:0 .45rem}
.bb.me{border-color:var(--accent)} .bb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .bb[aria-pressed="true"] b{background:rgba(255,255,255,.25);color:inherit}
.seth{font:700 1.05rem var(--f-display);margin:1rem 0 .1rem;display:flex;gap:.6rem;align-items:baseline}
.seth span{font:500 .75rem var(--f-mono);color:var(--ink2)}
.iss{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.iss+.iss{margin-top:.8rem}
.iss.closed{border-color:var(--ok)}
.iss-h{display:flex;flex-wrap:wrap;gap:.35rem .6rem;align-items:center;padding:.8rem 1rem;background:var(--surface2);border-bottom:1px solid var(--line)}
.iss.closed .iss-h{background:var(--ok-bg)}
.iss-t{flex:1 1 16rem;min-width:0;font:700 1.05rem/1.3 var(--f-display);overflow-wrap:anywhere}
.iss-t small{font:500 .75rem var(--f-mono);color:var(--ink2);display:block}
.iss-pills{display:flex;flex-wrap:wrap;gap:.3rem}
.stg{padding:.9rem 1rem .7rem;position:relative}
.stg+.stg{border-top:1px dashed var(--line)}
.stg-m{display:none}
.stg-dot{width:1.8rem;height:1.8rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 .8125rem var(--f-mono);border:2px solid var(--line);background:var(--surface);color:var(--ink2);flex:none}
.stg.done .stg-dot{background:var(--ok);border-color:var(--ok);color:#fff}
.stg.open .stg-dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stg-h{display:flex;flex-wrap:wrap;gap:.3rem .6rem;align-items:center}
.stg-n{font:500 .6875rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.stg-t{font-weight:600;overflow-wrap:anywhere}
.stg-d{font-size:.75rem;color:var(--ink2)}
.fbox{background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:.5rem .7rem;margin:.45rem 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.875rem}
.fbox.crit{background:var(--crit-bg);border-color:var(--crit)}
.fbox.ok{background:var(--ok-bg);border-color:var(--ok)}
.fbox b{display:block;font:500 .6875rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:.15rem}
.fbox.crit b{color:var(--crit)} .fbox.ok b{color:var(--ok)}
details.hops{margin:.5rem 0 .3rem}
details.hops>summary{cursor:pointer;font-size:.8125rem;font-weight:500;color:var(--accent);padding:.2rem 0}
.flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:.5rem .1rem .7rem;margin-top:.3rem;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.fc{flex:0 0 15.5rem;scroll-snap-align:end;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--ink2);border-radius:6px;padding:.55rem .7rem .65rem;display:flex;flex-direction:column;gap:.3rem;min-width:0}
.fc.hit{background:var(--warn-bg);border-color:var(--warn);border-top-color:var(--warn);box-shadow:0 0 0 2px var(--warn-bg)}
.fc.hit.now{box-shadow:0 0 0 2px var(--warn-bg),0 0 0 4px var(--accent-soft)}
.dwrap{display:inline-flex;gap:.35rem;align-items:center}.dwrap input[type=date]{font:inherit;min-height:2.25rem;padding:.2rem .5rem;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}.dwrap input.on{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.dban{margin:.6rem 0 0;padding:.55rem .8rem;border-radius:6px;background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);font-size:.875rem;font-weight:600}
.fc.now{border-color:var(--accent);border-top-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.fc-d{display:flex;flex-wrap:wrap;gap:.25rem;align-items:center;font:500 .75rem var(--f-mono);color:var(--ink2)}
.fc-p{display:flex;flex-wrap:wrap;gap:.25rem .35rem;align-items:center}
.fc-go{color:var(--ink2);font-size:.9rem}
.fc-w{font-size:.75rem;color:var(--ink2)}
.fc p{margin:0;font-size:.8125rem;color:var(--ink);overflow-wrap:anywhere}
.fl-ar{flex:0 0 2rem;display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:1.25rem}
.pt{display:inline-block;font-size:.8125rem;font-weight:600;border:1px solid var(--line);border-radius:4px;padding:.05rem .5rem;background:var(--surface)}
.pt.me{border-color:var(--accent);background:var(--accent-soft)}
.flowhint{font-size:.75rem;color:var(--ink2)}
.fc a.mail{display:inline-flex;gap:.35rem;align-items:center;align-self:flex-start;font-size:.8125rem;font-weight:600;color:var(--accent);text-decoration:none;border:1px solid var(--accent);border-radius:4px;padding:.15rem .55rem;background:var(--accent-soft)}
.fc a.mail:hover,.fc a.mail:focus-visible{text-decoration:underline}
.fc-mm{font-size:.6875rem;color:var(--ink2);overflow-wrap:anywhere}
.lk{background:none;border:0;color:var(--accent);cursor:pointer;font:500 .75rem var(--f-body);padding:0;text-decoration:underline;align-self:flex-start}
.fc-sp{flex:1}
.rng{font:500 .75rem var(--f-mono);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:.05rem .45rem;background:var(--surface2)}
.iss-f{display:flex;flex-wrap:wrap;gap:.45rem;padding:.6rem 1rem .9rem;border-top:1px solid var(--line)}
@media (max-width:560px){.stg{padding-inline:.7rem}.fc{flex-basis:13.5rem}.stg-dot{width:1.6rem;height:1.6rem}}

.rel{margin:0 0 .8rem;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:.6rem .8rem}
.rel-h{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .8rem}.rel-h select{flex:1;min-width:14rem;font:inherit;min-height:2.25rem;padding:.2rem .5rem;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}.rel-c{display:inline-flex;gap:.4rem;align-items:center;font-size:.8125rem;white-space:nowrap}.rel-c input{width:1rem;height:1rem;min-height:0;margin:0}
.rel-h h2{margin:0;font-size:1rem}
.rel-h p{margin:0;font-size:.8125rem;color:var(--ink2);flex:1;min-width:12rem}
.rel-l{display:flex;gap:.55rem;overflow-x:auto;padding:.15rem .1rem .5rem;scroll-snap-type:x proximity}
.rc{flex:0 0 15.5rem;scroll-snap-align:start;text-align:left;font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem;cursor:pointer;display:flex;flex-direction:column;gap:.25rem}
.rc:hover{border-color:var(--accent)}
.rc[aria-pressed="true"]{background:var(--warn-bg);border-color:var(--warn);box-shadow:0 0 0 2px var(--warn-bg)}
.rc .rd{font:600 .75rem var(--f-mono);color:var(--accent)}
.rc[aria-pressed="true"] .rd{color:var(--warn)}
.rc .rf{font-size:.8125rem;font-weight:600;overflow-wrap:anywhere}
.rc .rs{font-size:.75rem;color:var(--ink2)}
.rc .rn{margin-top:auto;font-size:.75rem;font-weight:600}
.rel-t{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-top:.45rem;font-size:.8125rem}
.rel-t label{display:inline-flex;gap:.4rem;align-items:center;cursor:pointer;white-space:nowrap}.rel-t input[type=checkbox]{width:1rem;height:1rem;min-height:0;flex:none;margin:0}
.rdd summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:.4rem .9rem;align-items:center;list-style:none;min-height:2.25rem}
.rdd summary::-webkit-details-marker{display:none}

  function store(c){return stores[c]||(stores[c]={rows:{},ls:[],loaded:false})}
  function notify(c){var s=store(c),docs=Object.keys(s.rows).map(function(id){return {id:id,data:function(){return JSON.parse(JSON.stringify(s.rows[id]))}}});s.ls.forEach(function(l){try{l.ok({docs:docs})}catch(e){}})}
  async function fetchAll(c){
    var s=store(c),from=0,all=[];
    for(;;){
      var r=await sb.from(TABLE).select('id,data').eq('collection',c).range(from,from+999);
      if(r.error)throw r.error;all=all.concat(r.data);if(r.data.length<1000)break;from+=1000;
    }
    s.rows={};all.forEach(function(x){s.rows[x.id]=x.data});s.loaded=true;notify(c);
  }
  function listen(){
    if(chan)return;
    chan=sb.channel('docs-all').on('postgres_changes',{event:'*',schema:'public',table:TABLE},function(p){
      var row=p.new&&p.new.id?p.new:p.old;if(!row)return;var c=row.collection,s=store(c);if(!s.loaded)return;
      if(p.eventType==='DELETE')delete s.rows[p.old.id];else s.rows[p.new.id]=p.new.data;notify(c)
    }).subscribe();
    setInterval(function(){Object.keys(stores).forEach(function(c){if(store(c).ls.length)fetchAll(c).catch(function(){})})},60000);
    document.addEventListener('visibilitychange',function(){if(!document.hidden)Object.keys(stores).forEach(function(c){if(store(c).ls.length)fetchAll(c).catch(function(){})})});
  }
  function clean(o){return JSON.parse(JSON.stringify(o))}
  var dbApi={
    collection:function(c){return {

        delete:async function(){var r=await sb.from(TABLE).delete().eq('collection',c).eq('id',id);if(r.error)throw r.error;var s=store(c);delete s.rows[id];notify(c)}}},
      onSnapshot:function(ok,err){var s=store(c);s.ls.push({ok:ok,err:err});listen();
        if(s.loaded)notify(c);else fetchAll(c).catch(function(e){if(err)err(e)});}
    }},
    bulkSet:async function(c,rows){
      for(var i=0;i<rows.length;i+=200){
        var chunk=rows.slice(i,i+200).map(function(o){var d=clean(o),id=d.id||rid();delete d.id;return {collection:c,id:id,data:d,updated_at:new Date().toISOString()}});
        var r=await sb.from(TABLE).upsert(chunk);if(r.error)throw r.error;
        chunk.forEach(function(x){store(c).rows[x.id]=x.data});
      }
      notify(c);
    }
  };
  var userApi={id:async function(){return session&&session.user.id},can:async function(){return true},
    profiles:async function(ids){var o={};var n=(session&&session.user.email||'').split('@')[0];ids.forEach(function(i){o[i]={name:n||'tôi'}});return o}};
  var dlApi={save:async function(o){var b=new Blob([o.data],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=o.filename;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}};
  window.claude={use:async function(n){await ready;if(n==='db')return dbApi;if(n==='user')return userApi;if(n==='downloads')return dlApi;return null}};
  if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
})();

    toast('Đã khôi phục '+n+' mục');
  }catch(e){toast(e&&e.message?e.message:'Không khôi phục được.')}
}
$('#btnBak').addEventListener('click',exportAll);
$('#btnRes').addEventListener('click',function(){if(confirm('Khôi phục sẽ ghi đè các mục trùng mã trong sổ hiện tại. Tiếp tục?'))$('#fileRes').click()});
$('#fileRes').addEventListener('change',function(){if(this.files[0])restoreAll(this.files[0]);this.value=''});

/* ---------- Events ---------- */
$('#tabs').addEventListener('click',function(e){var b=e.target.closest('[data-tab]');if(b&&b.dataset.tab!==st.tab)setTab(b.dataset.tab)});
$('#q').addEventListener('input',function(){st.q=this.value;renderList()});
$('#flt').addEventListener('change',function(){st.f=this.value;renderList()});
$('#flt2').addEventListener('change',function(){st.f2=this.value;renderList()});
$('#fd').addEventListener('change',function(){st.d=this.value||'';renderBar();renderList()});
$('#fdT').addEventListener('click',function(){st.d=TODAY;renderBar();renderList()});
$('#fdX').addEventListener('click',function(){st.d='';renderBar();renderList()});
$('#flt3').addEventListener('change',function(){st.f3=this.value;renderList()});
$('#btnAdd').addEventListener('click',function(){if(st.tab==='flows')openNewIssue();else openForm(st.tab,null)});
$('#btnImp').addEventListener('click',openImport);
$('#btnExp').addEventListener('click',exportCsv);
$('#list').addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var act=b.dataset.act,li=b.closest('.item'),id=li&&li.dataset.id,c=st.tab;
  if(act==='fball'){st.f3=st.f3===b.dataset.p?'':b.dataset.p;$('#flt3').value=st.f3;return renderList()}
  if(act.indexOf('f-')===0)return flowAct(act,b.closest('.iss').dataset.id,b);
  if(act==='add')return c==='flows'?openNewIssue():openForm(c,null);
  if(act==='import')return openImport();
  if(act==='gtoggle'){var k=b.dataset.key,isP=k.indexOf('p:')===0,cur=isP?st.g[k]!==false:st.g[k]===true;st.g[k]=!cur;return renderList()}
  if(act==='addto')return openForm('drawings',null,null,{part:b.dataset.part,section:b.dataset.sec});
  var it=(data[c]||[]).filter(function(x){return x.id===id})[0];if(!it)return;
  if(act==='toggle'){st.open=st.open===id?null:id;st.del=null;return renderList()}
  if(act==='edit')return openForm(c,it);
  if(act==='rev')return openForm(c,it,'rev');
  if(act==='ifc')return openForm(c,it,'ifc');
  if(act==='del'){
    if(st.del!==id){st.del=id;renderList();clearTimeout(st.dt);st.dt=setTimeout(function(){st.del=null;renderList()},4000);return}
    clearTimeout(st.dt);st.del=null;b.disabled=true;
    db.collection(c).doc(id).delete().then(function(){st.open=null;toast('Đã xóa')}).catch(function(err){toast(errMsg(err));renderList()});
  }
});

/* ---------- Init ---------- */
async function init(){
  buildFilter();render();
  var cl=window.claude;
  try{db=cl&&cl.use?await cl.use('db'):null}catch(e){db=null}
  try{user=cl&&cl.use?await cl.use('user'):null}catch(e){user=null}
  try{dl=cl&&cl.use?await cl.use('downloads'):null}catch(e){dl=null}
  if(user){try{uid=await user.id()}catch(e){}
    try{var cw=await user.can('data.write');canWrite=!!db&&cw!==false}catch(e){canWrite=!!db}}
  else canWrite=!!db;
  render();
  if(!db)return;
  ORDER.forEach(function(c){
    db.collection(c).onSnapshot(function(snap){
      data[c]=snap.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});
      if(c==='drawings')applyPatch(data[c]);
      loaded[c]=true;render();
    },function(err){dbErr=true;loaded[c]=true;render()});
  });
}
init();
})();
</script>
